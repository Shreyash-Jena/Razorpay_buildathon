[project]
name = "agentic-commerce"
version = "1.0.0"
description = "Universal Agentic Interoperability Server for Razorpay AI Buildathon"
requires-python = ">=3.11"
dependencies = [
    # Core
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",

    # Database
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13",

    # Payments
    "razorpay>=1.4",

    # Crypto
    "pynacl>=1.5",

    # Graph Analytics
    "networkx>=3.0",

    # Agent SDKs
    "openai>=1.30",
    "anthropic>=0.30",

    # HTTP
    "httpx>=0.27",

    # Utilities
    "structlog>=24.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
